---
server:
  host: "0.0.0.0"
  port: "9438"
  uri: "/metrics"
collection:
  interval: "5m"
  timeout: "60s"
# Optional OTLP gRPC metric push (disabled while endpoint is empty).
otlp:
  endpoint: ""
  insecure: false
  interval: "10s"
clusters:
  # Single-cluster quickstart: set OBS1_HOSTNAME, OBS1_USERNAME, OBS1_PASSWORD in
  # the environment (or a .env file) and the values below expand automatically.
  # config.yaml is the source of truth — for multiple clusters add one entry per
  # cluster, with literal values or your own ${OBS2_*} refs.
  - name: obs-prod-01
    host: "${OBS1_HOSTNAME}"
    username: "${OBS1_USERNAME}"
    password: "${OBS1_PASSWORD}"
    # mgmtPort: 4443
    # insecureSkipVerify disables TLS certificate verification (man-in-the-middle
    # risk). Leave it off in production; only enable for dev/test against a
    # cluster with a self-signed certificate. Accepts a native boolean or a
    # ${OBS1_SKIP_CERTIFICATE} env reference, resolved at startup like host/
    # username/password. Defaults to false.
    # insecureSkipVerify: true
    # insecureSkipVerify: ${OBS1_SKIP_CERTIFICATE}
    # collectMetering: namespace quota + billing usage (default true). Disable on
    # very large clusters if the billing query is too slow for the interval.
    # collectMetering: false
    # collectQuotas: the quotas collector, per-namespace quota limits (default
    # true, requires collectMetering). There is no bulk quota endpoint, so this
    # is one request per namespace per cycle; turn it off on a cluster that sets
    # no quotas — namespace usage, objects and MPU metrics come from the bulk
    # billing POST and are unaffected.
    # collectQuotas: false
    # collectDT: opt-in legacy node-local DT/connection scraping over ports
    # 9101/9021 (undocumented ECS internals, kept for v1 parity). On a
    # network-segmented cluster port 9101 is not reachable from outside the
    # cluster — see docs/metrics.md.
    # collectDT: true
    # Query the cluster's Flux monitoring store for per-node performance and
    # cluster DT counters the management API does not serve. Requires the
    # account to hold SYSTEM_MONITOR or SYSTEM_ADMIN. Off by default.
    # collectFlux: true

site_name: obs_exporter
site_description: Prometheus + OTLP exporter for Dell EMC ECS / ObjectScale object storage
repo_url: https://github.com/fjacquet/obs_exporter
repo_name: fjacquet/obs_exporter
# Material derives edit links from repo_url as edit/master/docs/; this repo's
# default branch is main, so the default would 404 the day content.action.edit
# is switched on.
edit_uri: edit/main/docs/
theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/logo.png
  features: [navigation.sections, navigation.top, content.code.copy]
markdown_extensions:
  - admonition
  - pymdownx.highlight
  # Renders ```mermaid fences as diagrams rather than code blocks. GitHub renders
  # the same fences natively, so a diagram written once works in both places.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - Quick start: getting-started/quickstart.md
  - Metrics reference: metrics.md
  - Migrating from v1: migration-v2.md
  - Migrating to v3: migration-v3.md
  - Deployment:
      - Docker: deployment/docker.md
      - Kubernetes: deployment/kubernetes.md
      - systemd: deployment/systemd.md
  - Architecture decisions:
      - Overview: adr/index.md
      - 0001 Supply-chain hardening: adr/0001-ci-supply-chain-hardening.md
      - 0002 Snapshot model: adr/0002-prometheus-snapshot-model.md
      - 0003 Hand-rolled client: adr/0003-hand-rolled-client-over-goobjectscale.md
      - 0004 Token auth & retry: adr/0004-token-auth-retry-policy.md
      - 0005 Hot reload swap: adr/0005-config-hot-reload-rebuild-and-swap.md
      - 0006 Naming, units & labels: adr/0006-metric-naming-units-and-label-invariant.md
      - 0007 OBS 4.1 API alignment: adr/0007-obs-4-1-api-alignment.md
      - 0008 Swagger 4.2 validation findings: adr/0008-swagger-4.2-validation-findings.md
      - 0009 Modular resource collectors: adr/0009-modular-resource-collectors.md
      - 0010 mockecs demo harness: adr/0010-mockecs-demo-harness.md
      - 0011 Opt-in Flux collector: adr/0011-flux-collector-for-unreachable-metrics.md
      - 0012 Label consolidation: adr/0012-label-consolidation-and-sum-safety.md

site_name: obs_exporter
site_description: Prometheus + OTLP exporter for Dell EMC ECS / ObjectScale object storage
repo_url: https://github.com/fjacquet/obs_exporter
repo_name: fjacquet/obs_exporter
# Material derives edit links from repo_url as edit/master/docs/; this repo's
# default branch is main, so the default would 404 the day content.action.edit
# is switched on.
edit_uri: edit/main/docs/
theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/logo.png
  features: [navigation.sections, navigation.top, content.code.copy]
markdown_extensions:
  - admonition
  - pymdownx.highlight
  # Renders ```mermaid fences as diagrams rather than code blocks. GitHub renders
  # the same fences natively, so a diagram written once works in both places.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/installation.md
      - Configure: getting-started/configuration.md
      - First run: getting-started/first-run.md
  # Order follows the job: understand, install, configure, deploy, operate, and
  # only then look things up. The audience runs systemd far more often than
  # Kubernetes, so Deploy leads with it.
  - Deploy:
      - systemd: deployment/systemd.md
      - Docker: deployment/docker.md
      - Kubernetes: deployment/kubernetes.md
  - Operate:
      - Verify & troubleshoot: operate/troubleshooting.md
      - Upgrading: operate/upgrading.md
  - Metrics:
      - Reading the metrics: metrics/reading.md
      - Reference: metrics/index.md
      - The Flux collector: metrics/flux.md
  - Try it without hardware: demo.md
  # The twelve ADRs stay published and stay linked from this index; they leave the
  # nav because they were more than half of it, and a reader looking for how to
  # deploy should not scan mostly maintainer material. mkdocs does not require a
  # page to be in the nav — it reports the omission at INFO level, not as a
  # warning, so --strict still passes.
  - Design decisions: adr/index.md

# --strict fails on a link to a missing *file*, but by default says nothing about
# a link to a missing *heading* — so `page.md#renamed-heading` rots silently. The
# 3.2.0 docs restructure moved and renamed headings across fifteen commits and
# every dangling fragment was caught by a human reading the diff, not by this
# gate. `warn` becomes fatal under --strict, which is how CI runs it, while
# leaving `mkdocs serve` usable mid-edit.
validation:
  anchors: warn
